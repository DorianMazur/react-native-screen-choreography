steps:
  - echo: Restart the Expo Router example; expect the demo picker.
  - launch: com.screenchoreography.routerexample
  - await: { visible: { text: "One player, two screens" } }
  - await: { idle: true }
  - echo: Scroll the demo picker to the live-player tile.
  - scroll-to: { target: { text: "One player, two screens" } }
  - echo: Open One player, two screens; expect Listening room.
  - tap:
      text: 04 · LIVE PLAYER, One player, two screens, Playback state survives native
        reparenting.
  - await: { visible: { text: Listening room } }
  - await: { idle: true }
  - echo: Pause the compact player; Play track must remain available through
      reparenting.
  - tap: { text: Pause track }
  - await: { visible: { text: Play track } }
  - echo: Open the paused player; expect the expanded Close control and unchanged
      paused state.
  - tap: { text: Open player }
  - await: { visible: { text: Close } }
  - await: { idle: true }
  - echo: Close the expanded player; expect Close to disappear and the compact
      paused player to return.
  - tap: { text: Close }
  - await: { hidden: { text: Close } }
  - await: { idle: true }
  - await: { visible: { text: Play track } }
