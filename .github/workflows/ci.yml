name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --runInBand

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - name: React Navigation
            workspace: react-native-screen-choreography-example
            gradle-wrapper: examples/react-navigation/android/gradle/wrapper/gradle-wrapper.properties
          - name: Expo Router
            workspace: screen-choreography-expo-router-example
            gradle-wrapper: examples/expo-router/android/gradle/wrapper/gradle-wrapper.properties

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles(matrix.example.gradle-wrapper) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build ${{ matrix.example.name }} example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn workspace ${{ matrix.example.workspace }} build:android

  build-ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - name: React Navigation
            path: examples/react-navigation
            workspace: react-native-screen-choreography-example
          - name: Expo Router
            path: examples/expo-router
            workspace: screen-choreography-expo-router-example

    env:
      XCODE_VERSION: 26
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install CocoaPods for ${{ matrix.example.name }} example
        working-directory: ${{ matrix.example.path }}
        run: |
          if [[ -f Gemfile ]]; then
            bundle install
            bundle exec pod install --repo-update --project-directory=ios
          else
            pod install --repo-update --project-directory=ios
          fi

      - name: Build ${{ matrix.example.name }} example for iOS
        run: yarn workspace ${{ matrix.example.workspace }} build:ios
