name: Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Test measurement and comment validation
        run: node --experimental-transform-types --test scripts/performance/*.test.ts

  android:
    needs: collectors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PERFORMANCE_OUTPUT: ${{ github.workspace }}/artifacts/performance/android-native-release
      PERFORMANCE_TIMING_CYCLES: '20'
      PERFORMANCE_ABI: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Collect native measurements and fixture reports
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/performance/run-android.sh native-release
      - name: Add timing summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/performance/workflow-summary.mts
      - name: Upload compact summary for PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-summary-android-native-release
          path: ${{ env.PERFORMANCE_OUTPUT }}/report/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-android-native-release
          path: ${{ env.PERFORMANCE_OUTPUT }}/
          if-no-files-found: warn
          retention-days: 7

  ios:
    needs: collectors
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PERFORMANCE_OUTPUT: ${{ github.workspace }}/artifacts/performance/ios-native-release
      PERFORMANCE_TIMING_CYCLES: '20'
      RCT_USE_RN_DEP: '1'
      RCT_USE_PREBUILT_RNCORE: '1'
      # RN's pod installer enables its compiler wrappers when this is set.
      USE_CCACHE: '1'
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'
      - name: Set up compiler cache
        id: ccache-setup
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          command -v ccache >/dev/null || brew install ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/choreography-ccache" >> "$GITHUB_ENV"
          ccache_toolchain="$(
            {
              xcodebuild -version
              xcrun --sdk iphonesimulator --show-sdk-version
              ccache --version
            } | shasum -a 256 | cut -d ' ' -f 1
          )"
          echo "toolchain=$ccache_toolchain" >> "$GITHUB_OUTPUT"
      - name: Restore compiler cache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-ios-performance-release-ccache-v1-${{ steps.ccache-setup.outputs.toolchain }}-${{ hashFiles('yarn.lock', 'examples/react-navigation/ios/Podfile*', '.yarn/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ios-performance-release-ccache-v1-${{ steps.ccache-setup.outputs.toolchain }}-${{ hashFiles('yarn.lock', 'examples/react-navigation/ios/Podfile*', '.yarn/patches/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-ios-performance-release-ccache-v1-${{ steps.ccache-setup.outputs.toolchain }}-
      - name: Set up Ruby and locked gems
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.4.3'
          bundler-cache: true
          working-directory: examples/react-navigation
      - name: Install CocoaPods
        working-directory: examples/react-navigation
        run: bundle exec pod install --repo-update --project-directory=ios
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Collect iOS release measurements
        run: bash scripts/performance/run-ios.sh native-release
      - name: Report compiler cache statistics
        if: always() && steps.ccache-setup.outcome == 'success'
        run: |
          ccache --show-stats --verbose
          {
            echo '### iOS compiler cache'
            echo
            ccache --show-stats | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save compiler cache
        # Completed compilations remain reusable even if an XCTest later fails.
        if: ${{ !cancelled() && steps.ccache-restore.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Add timing summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/performance/workflow-summary.mts
      - name: Upload compact summary for PR comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-summary-ios-native-release
          path: ${{ env.PERFORMANCE_OUTPUT }}/report/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload raw measurements and XCTest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-ios-native-release
          path: |
            ${{ env.PERFORMANCE_OUTPUT }}/
            !${{ env.PERFORMANCE_OUTPUT }}/build/
          if-no-files-found: warn
          retention-days: 7
