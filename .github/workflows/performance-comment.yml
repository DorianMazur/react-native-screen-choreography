name: Performance PR comment

on:
  workflow_run:
    workflows: [Performance]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: performance-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run only trusted default-branch code with the write-capable token.
      # PR artifacts are bounded JSON inputs, never executable files.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Create or update the current PR's performance comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/performance/post-comment.mts
