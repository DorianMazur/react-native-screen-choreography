name: Performance reports

on:
  workflow_run:
    workflows: [Performance]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: performance-publish-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Preserve main report and readings without artifact expiry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/performance/publish-history.mts

  comment:
    if: github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: performance-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # Run only trusted default-branch code with the write-capable token.
      # PR artifacts are bounded JSON inputs, never executable files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Create or update the current PR's performance comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-transform-types scripts/performance/post-comment.mts
